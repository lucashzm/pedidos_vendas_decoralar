<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido de Venda - Bm Moveis</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header><small>Bm Moveis</small><h1>Pedido de Venda</h1><p>Registre o cliente junto com a venda.</p><button id="logout">Sair</button></header>
<section><h2>Cliente</h2><div class="grid"><label class="campo"><span>Nome</span><input id="clienteNome" placeholder="Digite o nome"></label><label class="campo"><span>CPF/CNPJ</span><input id="clienteCpf" placeholder="Digite o CPF ou CNPJ"></label><label class="campo"><span>Telefone</span><input id="clienteTelefone" placeholder="Digite o telefone"></label><label class="campo"><span>E-mail</span><input id="clienteEmail" placeholder="Digite o e-mail"></label></div></section>
<section><h2>Endereço de entrega</h2><div class="grid"><label class="campo"><span>CEP</span><input id="cep" placeholder="Digite o CEP"></label><label class="campo"><span>Rua</span><input id="rua" placeholder="Digite a rua"></label><label class="campo"><span>Número</span><input id="numero" placeholder="Digite o número"></label><label class="campo"><span>Bairro</span><input id="bairro" placeholder="Digite o bairro"></label><label class="campo"><span>Cidade</span><input id="cidade" placeholder="Digite a cidade"></label></div></section>
<section><h2>Referência de entrega</h2><label class="campo campo-largo"><span>Referência</span><textarea id="referencia" placeholder="Ex: Casa ao lado do mercado, portão azul, ponto de referência para entrega"></textarea></label></section>
<section><h2>Produtos</h2><div class="grid"><label class="campo"><span>Produto</span><input id="buscaProduto" placeholder="Pesquisar produto por nome ou SKU"></label><label class="campo"><span>Resultado da busca</span><div id="resultadoBusca"></div></label><label class="campo"><span>Quantidade</span><input id="quantidade" type="number" value="1" min="1"></label></div><button id="adicionarProduto">+ Adicionar produto</button><ul id="listaProdutos"></ul><h3>Total: <span id="total">R$ 0,00</span></h3></section>
<section><h2>Pagamento e entrega</h2><div class="grid"><label class="campo"><span>Forma de pagamento</span><select id="pagamento"><option value="" selected disabled>Selecione a forma de pagamento</option><option>Pix</option><option>Cartão</option><option>Boleto</option><option>Dinheiro</option></select></label><label class="campo" id="condicaoCartaoCampo" style="display:none"><span>Condição do cartão</span><select id="condicaoCartao"><option value="" selected disabled>Selecione a condição</option><option value="À vista">À vista</option><option value="2x">2x</option><option value="3x">3x</option><option value="4x">4x</option><option value="5x">5x</option><option value="6x">6x</option><option value="7x">7x</option><option value="8x">8x</option><option value="9x">9x</option><option value="10x">10x</option><option value="11x">11x</option><option value="12x">12x</option></select></label><label class="campo"><span>Frete</span><input id="frete" inputmode="decimal" placeholder="Digite o valor do frete"></label><label class="campo"><span>Desconto adicional</span><input id="desconto" inputmode="decimal" placeholder="Digite um desconto adicional"><small id="descontoAutomatico" class="desconto-automatico"></small></label><label class="campo"><span>Previsão de entrega</span><input id="previsaoEntrega" type="date"></label></div></section>
<section><h2>Observações de entrega</h2><label class="campo campo-largo"><span>Observações</span><textarea id="observacoes" placeholder="Ex: ligar antes da entrega, horário permitido para recebimento"></textarea></label></section>
<button id="finalizar">Finalizar pedido</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.1/jspdf.umd.min.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
</body></html>
