<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido de Venda - Decoralar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header><small>DECORALAR</small><h1>Pedido de Venda</h1><p>Registre o cliente junto com a venda.</p></header>
<section><h2>Cliente</h2><div class="grid"><input id="clienteNome" placeholder="Nome"><input id="clienteCpf" placeholder="CPF/CNPJ"><input id="clienteTelefone" placeholder="Telefone"><input id="clienteEmail" placeholder="E-mail"></div></section>
<section><h2>Endereço de entrega</h2><div class="grid"><input id="cep" placeholder="CEP"><input id="rua" placeholder="Rua"><input id="numero" placeholder="Número"><input id="bairro" placeholder="Bairro"><input id="cidade" placeholder="Cidade"></div></section>
<section><h2>Referência de entrega</h2><textarea id="referencia" placeholder="Ex: Casa ao lado do mercado, portão azul, ponto de referência para entrega"></textarea></section>
<section><h2>Produtos</h2><div class="grid"><input id="buscaProduto" placeholder="Pesquisar produto por nome ou SKU">
<div id="resultadoBusca"></div>
<input id="quantidade" type="number" value="1" min="1"></div><button id="adicionarProduto">+ Adicionar produto</button><ul id="listaProdutos"></ul><h3>Total: R$ <span id="total">0,00</span></h3></section>
<section><h2>Pagamento e entrega</h2><div class="grid"><select id="pagamento"><option>Pix</option><option>Cartão</option><option>Boleto</option><option>À vista</option></select><input id="frete" placeholder="Frete"></div></section>
<section><h2>Vendedor</h2><select id="vendedorSelect"><option value="">Carregando...</option></select><textarea id="observacoes" placeholder="Observações"></textarea></section>
<button id="finalizar">Finalizar pedido</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
</body></html>
